<div class="max-w-4xl mx-auto p-6 space-y-6">

  <!-- Header -->
  <header class="dashboard-header space-y-2">
    <h1 class="text-2xl font-bold">Cookie Analysis Dashboard</h1>
    <p class="text-slate-600">
      Track and analyze cookie behavior across different browser configurations
    </p>
  </header>

  <!-- Upload -->
  <section class="space-y-3">
    <h2 class="text-lg font-semibold">URL File Upload</h2>

    <div class="flex items-center gap-2 max-w-xl">
      <input
        type="file"
        accept=".txt,text/plain"
        (change)="onFileSelected($event)"
        class="flex-1 p-1 border border-gray-300 rounded text-sm
               focus:outline-none focus:ring-2 focus:ring-blue-400
               file:px-4 file:py-2 file:rounded file:border-0
               file:bg-[#007bff] file:text-white cursor-pointer"
      />

      <button
        type="button"
        (click)="parseFile()"
        [disabled]="!selectedFile || loading"
        class="px-5 py-2.5 bg-[#007bff] text-white rounded font-bold
               hover:bg-[#0056b3]
               disabled:bg-gray-400 disabled:cursor-not-allowed">
        {{ loading ? 'Lädt…' : 'Senden' }}
      </button>
    </div>
  </section>

  <!-- TXT-Ausgabe -->
  <section class="max-w-xl text-sm text-slate-700 space-y-3">

    <div *ngIf="loading"
         class="text-amber-700 bg-amber-50 border border-amber-200 px-3 py-2 rounded">
      ⏳ Request wird gesendet...
    </div>

    <div *ngIf="error"
         class="flex items-center gap-2 text-red-800 bg-red-50
                border border-red-200 px-3 py-2 rounded">
      ❌ {{ error }}
    </div>

    <div *ngIf="result"
         class="text-emerald-800 bg-emerald-50
                border border-emerald-200 px-3 py-2 rounded">
      <h3 class="font-semibold">✅ Erfolgreiche Response</h3>
    </div>

    <ul *ngIf="lines.length"
        class="list-disc list-inside space-y-1">
      <li *ngFor="let line of lines">{{ line }}</li>
    </ul>

    <div *ngIf="!lines.length && !loading"
         class="text-slate-500 italic">
      Noch keine Datei geladen.
    </div>

  </section>
</div>
