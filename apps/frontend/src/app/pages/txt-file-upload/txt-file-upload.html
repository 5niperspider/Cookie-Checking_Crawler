<div>
    <h2 class="text-lg font-semibold mb-3">URL File Upload</h2>

    <div class="flex items-center justify-center">
        <div class="flex items-center gap-2 w-full max-w-xl">
            <input type="file" accept=".txt,text/plain" (change)="onFileSelected($event)" class="flex-1
               p-1
               border border-gray-300
               rounded
               text-sm leading-normal
               text-[#212529] bg-white
               focus:outline-none focus:ring-2 focus:ring-blue-400
               file:px-4 file:py-2
               file:rounded
               file:border-0
               file:bg-[#007bff]
               file:text-white
               cursor-pointer" />

            <button type="button" (click)="parseFile()" [disabled]="!selectedFile || loading" class="px-5 py-2.5
               bg-[#007bff] text-white
               border-none rounded
               font-bold cursor-pointer
               hover:bg-[#0056b3]
               disabled:bg-gray-400 disabled:cursor-not-allowed
               transition-colors">
                {{ loading ? 'Lädt…' : 'Senden' }}
            </button>
        </div>
    </div>
</div>

<div class="mt-4 max-w-xl mx-auto text-sm text-slate-700">
    <div *ngIf="loading" class="loading mb-2 text-amber-700 bg-amber-50 border border-amber-200 px-3 py-2 rounded">
        ⏳ Request wird gesendet...
    </div>

    <div *ngIf="error" class="error mb-2 flex items-center gap-2
           text-red-800 bg-red-50
           border border-red-200
           px-3 py-2 rounded">
        <span>❌</span>
        <span>{{ error }}</span>
    </div>

    <div *ngIf="result" class="success mb-2
           text-emerald-800 bg-emerald-50
           border border-emerald-200
           px-3 py-2 rounded">
        <h3 class="font-semibold mb-1">✅ Erfolgreiche Response</h3>
    </div>

    <ul class="list-disc list-inside space-y-1" *ngIf="lines.length">
        <li *ngFor="let line of lines">
            {{ line }}
        </li>
    </ul>

    <div class="text-slate-500 italic" *ngIf="!lines.length && !loading">
        Noch keine Datei geladen.
    </div>


    <!-- geladene Zeilen anzeigen -->
    <ul class="list-disc list-inside space-y-1" *ngIf="lines.length">
        <li *ngFor="let line of lines">
            {{ line }}
        </li>
    </ul>

    <div class="text-slate-500 italic" *ngIf="!lines.length && !loading">
        Noch keine Datei geladen.
    </div>
</div>
